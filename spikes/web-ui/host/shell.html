<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>rocco web UI spike</title>
<style>
body { margin: 0; background: #111; color: #ddd; font: 14px monospace; }
canvas { display: block; width: 800px; height: 600px; }
</style>
</head>
<body>
<!-- sokol_app finds the canvas by its default selector, #canvas. -->
<canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>
<pre id="output"></pre>
<script>
var output = document.getElementById("output");
function show(text) {
	console.log(text);
	output.textContent += text + "\n";
}
window.addEventListener("error", (event) => show("error: " + event.message));
window.addEventListener("unhandledrejection", (event) => show("rejection: " + event.reason));
var Module = { print: show, printErr: show, canvas: document.getElementById("canvas") };
</script>
{{{ SCRIPT }}}
</body>
</html>
