name: Grow the site

on:
  push:
    branches: [main]
    paths: ['.dex/tasks.jsonl']
  release:
    types: [published]
  # The release workflow publishes with the GITHUB_TOKEN, which starts no
  # release event, so the end of that workflow starts the rebuild.
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions: {}

concurrency:
  group: grow-site
  cancel-in-progress: true

jobs:
  deploy-hook:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Ask Vercel to rebuild pixelsprout.dev
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::VERCEL_DEPLOY_HOOK is not set. Skipping."
            exit 0
          fi
          curl --fail-with-body -sS -X POST "$HOOK"
