name: Build and test the Tour artifacts
description: >
  Installs the pinned Zig, Roc, Odin and emscripten, checks the Tour content,
  builds build/tour/ and runs the compile worker and Preview tests. The caller
  checks out the repository with its submodules first.
inputs:
  tag:
    description: The tag for manifest.json. Empty means git describe.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Read the Zig, Roc and emsdk pins
      shell: bash
      run: |
        grep -E '^ARG (ZIG_VERSION|ROC_COMMIT|EMSDK_VERSION)=' scripts/linux/Dockerfile | sed 's/^ARG //' >> "$GITHUB_ENV"
        echo "ROCCO_TOOLS=$RUNNER_TEMP/tools" >> "$GITHUB_ENV"

    # The worker and shim caches of one Roc pin are about 1.9 GiB together.
    # ci.yml and release.yml share this cache key, so a release restores the
    # Zig cache that main saved for its Roc pin.
    - uses: mlugg/setup-zig@v2
      with:
        version: ${{ env.ZIG_VERSION }}
        cache-key: roc-${{ env.ROC_COMMIT }}
        cache-size-limit: 3072

    - uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/tools/emsdk
        key: emsdk-${{ runner.os }}-${{ env.EMSDK_VERSION }}

    - uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install Odin, Roc and emscripten
      shell: bash
      run: |
        sh scripts/toolchain.sh install
        sh scripts/toolchain.sh install-emsdk

    - name: Check the Tour markers and step sources
      shell: bash
      run: python3 scripts/tour_content.py check

    - name: Test the image prefix
      shell: bash
      run: zig test tour/compile-worker/src/image.zig

    # It applies the carried Roc patches and fails on a memory.grow in the Tour host.
    - name: Build the Tour artifacts
      shell: bash
      env:
        TAG: ${{ inputs.tag }}
      run: sh scripts/toolchain.sh run python3 scripts/tour_artifacts.py build ${TAG:+--tag "$TAG"}

    - name: Lower every Tour step source and run the warm-against-cold stale check
      shell: bash
      run: node --test 'tour/compile-worker/test/*.test.mjs'

    # Chrome's WebGPU needs a Vulkan device. Mesa's lavapipe is a software one.
    # The .deb files are cached, because a slow Ubuntu mirror once took 9 minutes for these 28 MB.
    # The key is the candidate versions in the image's own package lists, not the image version,
    # because a new image rolls out every week and two run side by side during the rollout.
    - id: vulkan-versions
      shell: bash
      run: |
        versions=$(apt-cache show --no-all-versions mesa-vulkan-drivers libvulkan1 | awk '/^Version:/ { print $2 }' | paste -sd- -)
        echo "key=$ImageOS-$versions" >> "$GITHUB_OUTPUT"

    - id: vulkan-debs
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/vulkan-debs
        key: vulkan-debs-${{ steps.vulkan-versions.outputs.key }}

    - name: Download a software Vulkan device
      if: steps.vulkan-debs.outputs.cache-hit != 'true'
      shell: bash
      run: |
        debs="$RUNNER_TEMP/vulkan-debs"
        mkdir -p "$debs/partial"
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends --download-only -o Dir::Cache::archives="$debs" mesa-vulkan-drivers libvulkan1
        sudo rm -rf "$debs/partial" "$debs/lock"
        sudo chown -R "$USER" "$debs"

    # apt-get would fetch these files again from the mirror. dpkg installs only the cached ones.
    - name: Install a software Vulkan device
      shell: bash
      run: sudo dpkg -i "$RUNNER_TEMP"/vulkan-debs/*.deb

    # The same Chrome flags as scripts/web/headless-shot.sh.
    - name: Run the Preview in headless Chrome
      shell: bash
      env:
        CHROME_FLAGS: --headless=new --no-sandbox --enable-unsafe-webgpu --enable-features=Vulkan --use-angle=vulkan --disable-vulkan-surface
      run: |
        google-chrome --version
        node --test 'tour/host/test/*.test.mjs'
